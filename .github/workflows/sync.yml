name: ShelterLuv sync

# Pulls the shelter's live pet listings every 30 minutes and republishes the
# site to GitHub Pages. Nothing is committed back: the deployed copy carries the
# latest pets, and the next run starts from the saved pages again.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull live pets from ShelterLuv
        run: |
          chmod +x sync-one.sh refresh.sh
          ./sync-one.sh

      - name: Install the image tools
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      - name: Stage the site for publishing
        run: python3 deploy_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .deploy

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
